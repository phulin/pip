name: Pip
options:
  bundleIdPrefix: app.pip
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    PIP_API_URL: 'http://127.0.0.1:8787'
targets:
  Pip:
    type: application
    platform: iOS
    sources: [Pip, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pip.baby
    info:
      path: Pip/Info.plist
      properties:
        CFBundleDisplayName: Pip
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        PipAPIURL: $(PIP_API_URL)
        NSLocalNetworkUsageDescription: Connect to the Pip development server on your Mac for local testing.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [pipbaby]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - target: PipWidgets
  PipWidgets:
    type: app-extension
    platform: iOS
    sources: [PipWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pip.baby.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: APP_EXTENSION
    info:
      path: PipWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pip Feed
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PipTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PipTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Pip
schemes:
  Pip:
    build:
      targets:
        Pip: all
    test:
      targets: [PipTests]
